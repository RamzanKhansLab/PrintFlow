# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: printflow
    runtime: node
    plan: free

    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      - key: PYTHON_VERSION
        value: "3.13.9"

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true
